<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>تهيئة النظام</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="login-wrap"><div class="login">
  <h1>تهيئة النظام</h1>
  <p>لا يوجد حساب مدير بعد. أنشئ الحساب الأول للبدء.</p>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <div class="field"><label>الاسم الكامل</label><input name="full_name" placeholder="مدير النظام"></div>
    <div class="field"><label>اسم المستخدم</label><input name="username" value="{{ username }}" required autofocus></div>
    <div class="field"><label>كلمة المرور</label><input type="password" name="password" required>
      <span class="small muted">عشرة محارف على الأقل</span></div>
    <div class="field"><label>تأكيد كلمة المرور</label><input type="password" name="password2" required></div>
    <button class="btn" style="width:100%">إنشاء حساب المدير</button>
  </form>
  <div class="hint">تتعطّل هذه الصفحة تلقائياً بمجرد وجود مدير نشط، ولا يمكن استخدامها لإنشاء مدير آخر.</div>
</div></div></body></html>
