{% extends "base.html" %}{% block title %}عميل{% endblock %}
{% block body %}
<div class="page-head"><div><h1>{{ 'تعديل عميل' if cust else 'إضافة عميل' }}</h1>
<p>ما تحدده هنا هو الافتراضي فقط — يمكن تعديله داخل أي فاتورة دون تغيير بيانات العميل</p></div></div>
<div class="card" style="max-width:760px"><div class="body"><form method="post">
  <div class="grid g2">
    <div class="field"><label>كود العميل</label><input name="code" required value="{{ cust.code if cust }}"></div>
    <div class="field"><label>الاسم</label><input name="name" required value="{{ cust.name if cust }}"></div>
    <div class="field"><label>المندوب المسؤول</label><select name="rep_id" required>
      {% for r in reps %}<option value="{{ r.id }}" {{ 'selected' if cust and cust.rep_id==r.id }}>{{ r.name }}</option>{% endfor %}
    </select></div>
    <div class="field"><label>الهاتف</label><input name="phone" value="{{ cust.phone if cust else '' }}"></div>
    <div class="field"><label>نسبة الخصم الافتراضية %</label><input type="number" step="0.01" name="default_discount_pct" value="{{ cust.default_discount_pct if cust else 0 }}"></div>
    <div class="field"><label>مدة السداد الافتراضية (أيام)</label><input type="number" name="default_credit_days" value="{{ cust.default_credit_days if cust else 0 }}"></div>
    <div class="field"><label>وسيلة الدفع الافتراضية</label><select name="default_payment_method">
      {% for k,v in METHODS.items() %}<option value="{{ k }}" {{ 'selected' if cust and cust.default_payment_method==k }}>{{ v }}</option>{% endfor %}
    </select></div>
    <div class="field"><label>فترة السماح قبل عكس العمولة (أيام)</label>
      <input type="number" name="grace_days" value="{{ cust.grace_days if cust and cust.grace_days is not none else '' }}"
             placeholder="الافتراضي {{ default_grace }} يوم">
      <span class="small muted">اتركه فارغاً لاستخدام الافتراضي العام</span></div>
    <div class="field"><label>العنوان</label><input name="address" value="{{ cust.address if cust else '' }}"></div>
  </div>
  <div class="row-actions"><button class="btn">حفظ العميل</button><a class="btn ghost" href="{{ url_for('customers') }}">إلغاء</a></div>
</form></div></div>
{% endblock %}
